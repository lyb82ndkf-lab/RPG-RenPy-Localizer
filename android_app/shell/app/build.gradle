plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace "com.rpgrtl.shell"
    compileSdk 34

    defaultConfig {
        applicationId "com.rpgrtl.shell"
        minSdk 26
        targetSdk 28
        versionCode 300000
        versionName "3.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 浠?local.properties 鎴栫幆澧冨彉閲忚鍙栫鍚嶉厤缃紝閬垮厤瀵嗙爜娉勯湶
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('../local.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }

    signingConfigs {
        release {
            storeFile file(signingProps.getProperty('signingStoreFile', '../rpgrtl-release.keystore'))
            keyAlias signingProps.getProperty('signingKeyAlias', System.getenv('RPGRTL_KEY_ALIAS') ?: '')
            storePassword signingProps.getProperty('signingStorePassword', System.getenv('RPGRTL_STORE_PASSWORD') ?: '')
            keyPassword signingProps.getProperty('signingKeyPassword', System.getenv('RPGRTL_KEY_PASSWORD') ?: '')
        }
    }

    // Winlator's supported production target is 64-bit ARM.  The engine is
    // shipped as prebuilt libraries so a normal UI build does not require a
    // local NDK. Pass -PrebuildNative=true when deliberately rebuilding it.
    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    if (providers.gradleProperty("prebuildNative").map { it.toBoolean() }.orElse(false).get()) {
        ndkVersion "24.0.8215888"
        externalNativeBuild {
            cmake {
                version "3.22.1"
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += [
            "json",
            "ogg",
            "m4a",
            "mp3",
            "wav",
            "mid",
            "png",
            "jpg",
            "jpeg",
            "webp",
            "gif",
            "rpa",
            "rpyc",
            "rvdata2",
            "rgss3a",
            "rgss2a",
            "rgssad",
            "so",
            "zst",
            "tzst"
        ]
    }

    packaging {
        jniLibs {
            // Wine loads companion shared objects at runtime; keep Android's
            // conventional extracted-library layout for the compatibility engine.
            useLegacyPackaging true
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

tasks.register("syncMobileUi", Copy) {
    from("../../mobile_ui")
    into("src/main/assets/mobile_ui")
    doFirst {
        delete("src/main/assets/mobile_ui")
    }
}

preBuild.dependsOn("syncMobileUi")

def requiredEngineLibraries = [
    "libwinlator.so",
    "libvirglrenderer.so",
    "libvortekrenderer.so",
    "libgladiorenderer.so",
    "libmidihandler.so",
    "libfile_redirect_hook.so",
    "libgsl_alloc_hook.so",
    "libhook_impl.so",
    "libmain_hook.so"
]

tasks.register("verifyPrebuiltEngine") {
    doLast {
        def engineDir = file("src/main/jniLibs/arm64-v8a")
        def missing = requiredEngineLibraries.findAll { !new File(engineDir, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Winlator prebuilt engine libraries: ${missing.join(', ')}")
        }
    }
}

if (!providers.gradleProperty("prebuildNative").map { it.toBoolean() }.orElse(false).get()) {
    preBuild.dependsOn("verifyPrebuiltEngine")
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.appcompat:appcompat:1.4.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "com.google.android.material:material:1.4.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.github.luben:zstd-jni:1.5.2-3@aar"
    implementation "org.tukaani:xz:1.7"
    implementation "org.apache.commons:commons-compress:1.20"
}
