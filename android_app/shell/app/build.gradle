plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace "com.rpgrtl.shell"
    compileSdk 34

    defaultConfig {
        applicationId "com.rpgrtl.shell"
        minSdk 26
        targetSdk 28
        versionCode 330900
        versionName "3.3.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 从 local.properties 或环境变量读取签名配置
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('../local.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }

    signingConfigs {
        release {
            storeFile file(signingProps.getProperty('signingStoreFile', '../rpgrtl-release.keystore'))
            keyAlias signingProps.getProperty('signingKeyAlias', System.getenv('RPGRTL_KEY_ALIAS') ?: '')
            storePassword signingProps.getProperty('signingStorePassword', System.getenv('RPGRTL_STORE_PASSWORD') ?: '')
            keyPassword signingProps.getProperty('signingKeyPassword', System.getenv('RPGRTL_KEY_PASSWORD') ?: '')
        }
    }

    // Winlator's supported production target is 64-bit ARM.
    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    if (providers.gradleProperty("prebuildNative").map { it.toBoolean() }.orElse(false).get()) {
        ndkVersion "24.0.8215888"
        externalNativeBuild {
            cmake {
                version "3.22.1"
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += [
            "json",
            "ogg",
            "m4a",
            "mp3",
            "wav",
            "mid",
            "png",
            "jpg",
            "jpeg",
            "webp",
            "gif",
            "rpa",
            "rpyc",
            "rvdata2",
            "rgss3a",
            "rgss2a",
            "rgssad",
            "so",
            "zst",
            "tzst"
        ]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

tasks.register("syncMobileUi", Copy) {
    from("../../mobile_ui")
    into("src/main/assets/mobile_ui")
    onlyIf { file("../../mobile_ui").exists() }
}

def requiredEngineLibraries = [
    "libwinlator.so",
    "libvirglrenderer.so",
    "libvortekrenderer.so",
    "libgladiorenderer.so",
    "libmidihandler.so",
    "libfile_redirect_hook.so",
    "libgsl_alloc_hook.so",
    "libhook_impl.so",
    "libmain_hook.so"
]

tasks.register("verifyPrebuiltEngine") {
    doLast {
        def engineDir = file("src/main/jniLibs/arm64-v8a")
        def missing = requiredEngineLibraries.findAll { !new File(engineDir, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Winlator prebuilt engine libraries: ${missing.join(', ')}")
        }
    }
}

if (!providers.gradleProperty("prebuildNative").map { it.toBoolean() }.orElse(false).get()) {
    preBuild.dependsOn("verifyPrebuiltEngine")
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "com.google.android.material:material:1.12.0"

    // Jetpack Compose & Material 3
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    // Google Accompanist 配套组件库
    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.36.0'
    implementation 'com.google.accompanist:accompanist-permissions:0.36.0'
    implementation 'com.google.accompanist:accompanist-swiperefresh:0.36.0'
    implementation 'com.google.accompanist:accompanist-drawablepainter:0.36.0'

    // 网络与异步
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.google.code.gson:gson:2.10.1"

    // 引擎与解压
    implementation "com.github.luben:zstd-jni:1.5.2-3@aar"
    implementation "org.tukaani:xz:1.7"
    implementation "org.apache.commons:commons-compress:1.20"
}




